name: agent-treasury
on:
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/agent-treasury-source-gates.yml"
  push:
    branches: [main]
    paths:
      - "solana/**"
  workflow_dispatch:

concurrency:
  group: agent-treasury-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.79.0"          # keep in sync with solana/rust-toolchain.toml
  IDL_NIGHTLY: "nightly-2024-11-01" # anchor 0.30.1 IDL build needs a nightly with proc_macro::SourceFile
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"

jobs:
  source-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/preflight.test.mjs

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Install IDL nightly
        run: rustup toolchain install "$IDL_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
          cache-all-crates: true
      - name: Cache Solana and Anchor CLIs
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install Solana CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
      - name: Install Anchor CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked
      - name: Add CLIs to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: rustc --version && solana --version && anchor --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit and native program tests
        run: cargo test --locked
      - name: Localnet keys (ephemeral, never committed)
        run: |
          solana-keygen new --no-bip39-passphrase --silent -o "$HOME/.config/solana/id.json"
          anchor keys sync
      - name: anchor build (SBF + IDL)
        run: RUSTUP_TOOLCHAIN="$IDL_NIGHTLY" anchor build
      - name: Program tests against the SBF binary
        run: SBF_OUT_DIR="$PWD/target/deploy" cargo test --locked --test program
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: anchor test (solana-test-validator end-to-end)
        run: anchor test --skip-build
