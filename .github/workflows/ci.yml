name: PARRALAX Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  rust-engine:
    name: Rust Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust-engine
      - name: Check
        working-directory: services/rust-engine
        run: cargo check --all-features
      - name: Test
        working-directory: services/rust-engine
        run: cargo test --all-features
      - name: Clippy
        working-directory: services/rust-engine
        run: cargo clippy -- -D warnings

  rust-execution:
    name: Rust HFT Execution Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/execution-engine
      - name: Check
        working-directory: rust/execution-engine
        run: cargo check --all-features
      - name: Test
        working-directory: rust/execution-engine
        run: cargo test --all-features

  go-git-service:
    name: Go Git Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: services/git-service
        run: go build ./...
      - name: Test
        working-directory: services/git-service
        run: go test ./... -v -race
      - name: Vet
        working-directory: services/git-service
        run: go vet ./...

  go-cli:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: services/cli
        run: go build ./...
      - name: Test
        working-directory: services/cli
        run: go test ./... -v

  python-ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: services/ai-service
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: services/ai-service
        run: ruff check .
      - name: Type check
        working-directory: services/ai-service
        run: mypy app/ --ignore-missing-imports
      - name: Test
        working-directory: services/ai-service
        run: pytest tests/ -v --cov=app
      - name: Smoke actuary suite
        working-directory: services/ai-service
        run: python -c "from app.routers.actuary import router; print('Actuary router OK')"
      - name: Smoke trading router
        working-directory: services/ai-service
        run: python -c "from app.routers.trading import router; print('Trading router OK')"
      - name: Smoke financial languages router
        working-directory: services/ai-service
        run: python -c "from app.routers.financial_languages.router import router; print('Financial languages router OK')"

  python-trading:
    name: Python Trading API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: python
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: python
        run: ruff check .
      - name: Test
        working-directory: python
        run: pytest tests/ -v
      - name: Smoke package import
        working-directory: python
        run: python -c "import parralax; print(parralax.__version__)"

  rails-api:
    name: Rails API
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: parralax_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: services/rails-api
      - name: Setup DB
        working-directory: services/rails-api
        env:
          DATABASE_URL: 'mysql2://root:test@127.0.0.1:3306/parralax_test'
          RAILS_ENV: test
        run: bundle exec rails db:create db:migrate
      - name: Test
        working-directory: services/rails-api
        env:
          DATABASE_URL: 'mysql2://root:test@127.0.0.1:3306/parralax_test'
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379
        run: bundle exec rspec

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-ai-service, python-trading, rust-engine, go-git-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AI Service
        working-directory: services/ai-service
        run: pip install -e '.[dev]'
      - name: Run Integration Tests
        working-directory: services/ai-service
        run: pytest tests/integration/ -v --tb=short

  docker-build:
    name: Docker Build All Services
    runs-on: ubuntu-latest
    needs: [rust-engine, rust-execution, go-git-service, go-cli, python-ai-service, python-trading, rails-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: rust-engine
            context: services/rust-engine
          - name: git-service
            context: services/git-service
          - name: ai-service
            context: services/ai-service
          - name: rails-api
            context: services/rails-api
          - name: execution-engine
            context: rust/execution-engine
          - name: trading-api
            context: python
          - name: cli
            context: services/cli
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest,${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to K8s
        run: |
          echo "Deploying PARRALAX platform to Kubernetes..."
          echo "Deployment command is intentionally gated until cluster credentials and manifests are configured."
