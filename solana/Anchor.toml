# The single Anchor workspace for this repository. Run anchor commands from solana/.
[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

# LOCALNET / TEST ONLY program ID. Its keypair is generated locally and never
# committed. A production deployment MUST use a managed program keypair and a
# multisig upgrade authority; see DEPLOYMENT.md.
[programs.localnet]
parralax_agent_treasury = "5HJCtwtWWvDDQiMLVuvrwyqaVfXgX3hZnzMTarTKv61p"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/agent-treasury"]

[scripts]
test = "node --test tests/*.test.mjs"

[test]
startup_wait = 10000
